name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test

      - run: npm --prefix functions ci
      - run: npm --prefix functions run build
      - run: npm --prefix functions test

      # Firestore security rules — the only server-side check of the access
      # model. Needs Java for the emulator.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm run test:rules:emulated
